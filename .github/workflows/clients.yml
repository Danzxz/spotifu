name: Test native integration components
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clients:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test core and resolver
        run: |
          swift test
          python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Test desktop native track matching
        run: |
          node Tests/desktop.test.cjs
          node Tests/desktop-integration.test.cjs
