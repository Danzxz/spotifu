name: Spotifu
options:
  bundleIdPrefix: com.danzxz
  deploymentTarget:
    iOS: '15.0'
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  Spotifu:
    type: application
    platform: iOS
    sources:
      - Shared
      - path: ios/SpotifuApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danzxz.spotifu
        INFOPLIST_KEY_UIBackgroundModes: [audio]
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your personal music download server.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SpotifuMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danzxz.spotifu.mac
